<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi PokéAPI App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Pokédex Buscador</h1>
        <div class="search-box">
            <input type="text" id="pokemon-input" placeholder="Escribe el nombre o ID...">
            <button id="search-btn">Buscar</button>
        </div>
        
        <!-- Contenedor dinámico para la información del Pokémon -->
        <div id="pokemon-card" class="card"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
